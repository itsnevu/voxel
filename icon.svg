<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Reel Fortune 3D · a voxel fish drawn on the same 16px grid the game's own
       pixel-art icons use, so it stays sharp at a 16px browser tab. -->
  <rect width="16" height="16" rx="3.5" fill="#0a1418"/>
  <g fill="#2aa898">
    <rect x="1" y="5" width="4" height="1"/><rect x="2" y="6" width="3" height="1"/>
    <rect x="3" y="7" width="2" height="2"/>
    <rect x="2" y="9" width="3" height="1"/><rect x="1" y="10" width="4" height="1"/>
  </g>
  <rect x="8" y="3" width="3" height="1" fill="#ffcf5c"/>
  <g fill="#39d7c4">
    <rect x="6" y="4" width="5" height="1"/><rect x="5" y="5" width="8" height="1"/>
    <rect x="4" y="6" width="9" height="1"/><rect x="4" y="7" width="10" height="1"/>
    <rect x="4" y="8" width="10" height="1"/><rect x="4" y="9" width="9" height="1"/>
    <rect x="5" y="10" width="8" height="1"/><rect x="6" y="11" width="5" height="1"/>
  </g>
  <rect x="11" y="6" width="1" height="1" fill="#0a1418"/>
  <rect x="7" y="12" width="3" height="1" fill="#ffcf5c"/>
</svg>

# =============================================================================
# Reel Fortune 3D - nginx reverse proxy
#
# Pasang di: /etc/nginx/sites-available/reelfortune
# Aktifkan  : ln -s /etc/nginx/sites-available/reelfortune /etc/nginx/sites-enabled/
# Uji       : nginx -t && systemctl reload nginx
#
# GANTI game.example.com dengan domain asli Anda.
# File ini adalah versi HTTP (port 80) saja. Jalankan certbot SETELAH blok ini
# aktif; certbot menyisipkan sendiri blok 443 + redirect. Lihat catatan di bawah.
# =============================================================================

# Rate limit untuk endpoint API. Direktif limit_req_zone hanya boleh berada di
# level http, jadi baris ini HARUS dipindah ke /etc/nginx/nginx.conf (di dalam
# blok http { ... }) atau ditaruh sebagai /etc/nginx/conf.d/reelfortune-limits.conf.
# Kalau dibiarkan di sini, nginx menolak start dengan
# "limit_req_zone directive is not allowed here".
#
#   limit_req_zone $binary_remote_addr zone=rf_api:10m  rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=rf_auth:10m rate=1r/s;

# Upgrade WebSocket. Tanpa map ini, /ws jatuh ke location generik yang mengirim
# `Connection ""`, upgrade-nya dibuang sebelum sampai ke Node, dan klien masuk
# loop reconnect selamanya. Presence, chat, registry ore/pohon, derby dan
# pengumuman deed semuanya diam-diam mati di produksi (di dev lokal tanpa nginx
# semuanya jalan, itu sebabnya lama tidak ketahuan).
#
# `map` hanya boleh di level http, sama seperti limit_req_zone di atas. Bedanya,
# baris ini ada DI LUAR blok server, dan file ini sendiri di-include dari dalam
# `http { ... }` (sites-enabled maupun conf.d), jadi di sini sudah level http.
# Kalau di server Anda file ini justru ditempel ke dalam blok server milik orang
# lain, map ini harus ikut pindah ke tempat limit_req_zone tadi -- kalau tidak,
# nginx menolak start dengan "unknown connection_upgrade variable".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;

    # Root berisi file klien: index.html, game.js, lib/three.min.js
    root /opt/reelfortune;
    index index.html;

    access_log /var/log/nginx/reelfortune.access.log;
    error_log  /var/log/nginx/reelfortune.error.log warn;

    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout  15s;

    # -------------------------------------------------------------------------
    # Kompresi
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Header keamanan dasar
    #
    # PENTING: di nginx, `add_header` pada satu level hanya diwarisi ke level
    # anak SELAMA level anak itu tidak punya `add_header` sendiri. Begitu sebuah
    # location menambahkan satu add_header, SELURUH header di bawah ini hilang
    # untuk location tersebut.
    #
    # Karena itu pengaturan cache di bawah memakai direktif `expires`, bukan
    # `add_header Cache-Control`. `expires` menghasilkan header Cache-Control
    # tanpa mematikan pewarisan. Jangan diubah jadi add_header tanpa ikut
    # menyalin ulang ketiga header ini ke setiap location.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # /lib/ - aset pihak ketiga yang tidak pernah berubah (three.min.js, ~590 KB).
    # Dilayani langsung dari disk oleh nginx, TIDAK lewat Node.
    #
    # Sengaja memakai `root` warisan dari server block, bukan `alias`. Path URL
    # /lib/... sudah persis memetakan ke /opt/reelfortune/lib/..., dan kombinasi
    # `alias` + `try_files` punya perilaku menjebak di nginx. Jangan diubah
    # jadi alias tanpa alasan kuat.
    #
    # Kalau Three.js suatu saat di-upgrade, GANTI NAMA filenya
    # (mis. three.r128.min.js) supaya cache lama tidak nyangkut di browser.
    # -------------------------------------------------------------------------
    location /lib/ {
        access_log off;
        expires 1y;
    }

    # -------------------------------------------------------------------------
    # Kode & markup game - JANGAN di-cache lama, kalau tidak pemain akan
    # menjalankan game.js lama melawan API server yang sudah baru.
    # `expires -1` menghasilkan Cache-Control: no-cache.
    # -------------------------------------------------------------------------
    # try_files -> @backend supaya setup tetap jalan kalau Anda memilih file
    # klien dilayani oleh Node, bukan dari disk.
    location = /game.js {
        expires -1;
        try_files $uri @backend;
    }

    location = /index.html {
        expires -1;
        try_files $uri @backend;
    }

    # -------------------------------------------------------------------------
    # Login/register - dibatasi lebih ketat untuk meredam brute force.
    # Prefix ini lebih panjang dari /api/ sehingga menang dalam pemilihan
    # location nginx. Aktifkan bersama limit_req_zone rf_auth di atas.
    # -------------------------------------------------------------------------
    location /api/auth/ {
        # limit_req zone=rf_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_buffering off;
        expires -1;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # API otoritatif -> Node di 127.0.0.1:8787
    # -------------------------------------------------------------------------
    location /api/ {
        # limit_req zone=rf_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # Respons API tidak boleh masuk cache mana pun.
        proxy_buffering off;
        expires -1;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # WebSocket realtime -> Node di 127.0.0.1:8787
    #
    # Exact match (`= /ws`) supaya blok ini selalu menang atas `location /`,
    # apa pun urutannya. Header Upgrade/Connection + HTTP/1.1 adalah syarat mutlak
    # handshake; sisanya sama persis dengan @backend supaya server tetap melihat
    # IP asli pemain (rate limit dan moderasi di Node bergantung padanya).
    #
    # Blok ini sengaja TIDAK memakai add_header apa pun, jadi ketiga header
    # keamanan dari server block tetap diwarisi. Lihat catatan pewarisan di atas
    # sebelum menambahkan header di sini.
    # -------------------------------------------------------------------------
    location = /ws {
        # Token sesi 30 hari saat ini ikut di query string (`/ws?token=...`) dan
        # log format bawaan merekam baris request apa adanya, jadi bearer pemain
        # akan mendarat di access log dan ikut ter-backup. Mitigasi sementara:
        # matikan access log khusus di sini. Cabut lagi setelah klien + server
        # sama-sama memindahkan token ke Sec-WebSocket-Protocol (subprotocol);
        # sesudah itu baris request sudah aman untuk dicatat.
        access_log off;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering off;

        # Server mem-ping tiap 30 detik (PING_MS di server/src/realtime.js), jadi
        # read timeout 30s milik location lain persis sama dengan interval ping:
        # socket sehat yang kebetulan sepi bisa diputus nginx tepat sebelum ping
        # berikutnya tiba. 120s memberi ruang beberapa ping meleset dulu sebelum
        # koneksi benar-benar dianggap mati.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # -------------------------------------------------------------------------
    # Sisanya: coba file statis dulu, kalau tidak ada lempar ke Node.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Jangan pernah layani file sensitif kalau repo lengkap ikut ter-upload.
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    # =========================================================================
    # HTTPS / certbot
    # =========================================================================
    # Setelah file ini aktif dan `nginx -t` lolos, jalankan:
    #
    #   apt install -y certbot python3-certbot-nginx
    #   certbot --nginx -d game.example.com
    #
    # Certbot otomatis:
    #   - menambah blok `listen 443 ssl;` beserta ssl_certificate & key
    #   - menambah redirect 80 -> 443 (pilih opsi "Redirect" saat ditanya)
    #   - memasang timer perpanjangan (cek: systemctl list-timers | grep certbot)
    #
    # Uji perpanjangan tanpa benar-benar memperpanjang:
    #   certbot renew --dry-run
    #
    # SETELAH HTTPS aktif, tambahkan HSTS di blok 443 (JANGAN di blok 80):
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # Ingat peringatan pewarisan add_header di atas: kalau HSTS ditambahkan di
    # server block 443, salin juga ketiga header keamanan lainnya ke sana.
    #
    # Catatan: port 80 harus tetap terbuka untuk validasi HTTP-01, termasuk saat
    # perpanjangan otomatis. Jangan tutup port 80 di ufw.
    # =========================================================================
}
